<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Йцукен Сокращатель</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --hover: #f0f2f8; --input: #f5f6fa;
    --text: #1a1a2e; --muted: #8a8fa3; --border: #e6e8f0;
    --accent: #f97316; /* Оранжевый цвет */
    --accent-hover: #ea580c; 
    --accent-soft: #fff7ed; 
    --success: #10b981; --danger: #ef4444; --danger-soft: #fdeaea;
    --shadow: 0 4px 16px rgba(16, 24, 40, 0.08);
  }
  [data-theme="dark"] {
    --bg: #0f1117; --card: #181b24; --hover: #21252f; --input: #21252f;
    --text: #f0f2f8; --muted: #8a8fa3; --border: #2a2f3b;
    --accent: #fb923c; /* Оранжевый для темной темы */
    --accent-hover: #f97316; 
    --accent-soft: #2a1b10;
    --success: #34d399; --danger: #f87171; --danger-soft: #2a1618;
    --shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    min-height: 100vh; padding: 24px 16px 60px;
    transition: background .25s, color .25s;
  }
  .app { max-width: 820px; margin: 0 auto; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #fbbf24);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .logo h1 { font-size: 20px; }
  .logo p { font-size: 12px; color: var(--muted); }
  .theme-btn {
    width: 42px; height: 42px; border-radius: 11px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 18px; cursor: pointer; transition: all .2s;
  }
  .theme-btn:hover { background: var(--hover); }

  .card {
    background: var(--card); border-radius: 18px; padding: 24px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .form-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }

  .input-row { display: flex; gap: 10px; }
  .input-wrap { flex: 1; position: relative; }
  .input-wrap .icon {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--muted); pointer-events: none;
  }
  #urlInput {
    width: 100%; padding: 13px 14px 13px 40px;
    border: 1.5px solid var(--border); border-radius: 11px;
    background: var(--input); color: var(--text); font-size: 15px;
    outline: none; transition: all .2s;
  }
  #urlInput::placeholder { color: var(--muted); }
  #urlInput:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  #urlInput.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px var(--danger-soft); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 13px 22px; border: none; border-radius: 11px;
    font-weight: 600; font-size: 15px; cursor: pointer;
    transition: all .2s; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: 0.7; cursor: wait; }

  .hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; min-height: 18px; padding-left: 3px; }
  .hint.error { color: var(--danger); }

  .result {
    margin-top: 14px; padding: 14px 16px; border-radius: 12px;
    background: var(--accent-soft); border: 1.5px solid var(--accent);
    display: none; align-items: center; gap: 12px;
  }
  .result.show { display: flex; }
  .result-info { flex: 1; min-width: 0; }
  .result-label {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--accent); margin-bottom: 3px;
  }
  .result a {
    color: var(--text); font-weight: 600; font-size: 14.5px;
    text-decoration: none; word-break: break-all; display: block;
  }
  .result a:hover { text-decoration: underline; }
  .result-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font-size: 15px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: all .15s;
  }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn.ok { background: var(--success); border-color: var(--success); color: #fff; }

  .history { margin-top: 26px; }
  .history-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
  }
  .history-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; background: var(--accent-soft); color: var(--accent);
  }
  .history-controls { display: flex; gap: 8px; align-items: center; }
  #searchInput {
    padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px;
    background: var(--card); color: var(--text); font-size: 13.5px;
    outline: none; width: 180px; transition: all .2s;
  }
  #searchInput:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-ghost {
    padding: 9px 14px; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--card); color: var(--text); font-size: 13px;
    font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn-ghost:hover { background: var(--hover); }
  .btn-ghost.danger { color: var(--danger); border-color: var(--danger-soft); }
  .btn-ghost.danger:hover { background: var(--danger-soft); }

  .links { display: flex; flex-direction: column; gap: 8px; }
  .link-item {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 15px;
    display: flex; align-items: center; gap: 12px;
    transition: all .2s;
  }
  .link-item:hover { border-color: var(--accent); }
  .link-favicon {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0; overflow: hidden;
  }
  .link-favicon img { width: 100%; height: 100%; object-fit: cover; }
  .link-body { flex: 1; min-width: 0; }
  .link-short {
    color: var(--accent); font-weight: 600; font-size: 14px;
    text-decoration: none; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .link-short:hover { text-decoration: underline; }
  .link-meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 11.5px; color: var(--muted); margin-top: 2px;
  }
  .link-long { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .link-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .link-actions .icon-btn { width: 30px; height: 30px; font-size: 13px; border-radius: 8px; }
  .link-actions .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
  .link-actions .icon-btn.del:hover { background: var(--danger-soft); color: var(--danger); }

  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-icon { font-size: 44px; margin-bottom: 10px; opacity: .6; }
  .empty h3 { font-size: 15px; color: var(--text); margin-bottom: 4px; }
  .empty p { font-size: 13px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text); color: var(--card);
    padding: 11px 20px; border-radius: 11px;
    font-size: 13.5px; font-weight: 500;
    box-shadow: 0 10px 32px rgba(0,0,0,.25);
    opacity: 0; transition: all .3s cubic-bezier(.16,1,.3,1);
    pointer-events: none; z-index: 1000; max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { background: var(--success); color: #fff; }
  .toast.error { background: var(--danger); color: #fff; }

  @media (max-width: 600px) {
    .input-row { flex-direction: column; }
    .btn-primary { width: 100%; }
    .history-controls { width: 100%; }
    #searchInput { flex: 1; width: auto; }
    .result { flex-direction: column; align-items: stretch; }
    .result-actions { justify-content: flex-end; }
    .link-long { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🔗</div>
      <div>
        <h1>Йцукен Сокращатель</h1>
        <p>Реально работает!</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" title="Сменить тему">🌙</button>
  </header>

  <section class="card">
    <div class="form-title">Вставьте длинную ссылку</div>
    <div class="input-row">
      <div class="input-wrap">
        <span class="icon">🔗</span>
        <input type="text" id="urlInput" placeholder="https://example.com/страница" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn btn-primary" id="shortenBtn" type="button">Сократить</button>
    </div>
    <div class="hint" id="hint">Ссылки создаются через сервис clck.ru</div>

    <div class="result" id="result">
      <div class="result-info">
        <div class="result-label">Готово</div>
        <a id="resultLink" href="#" target="_blank" rel="noopener"></a>
      </div>
      <div class="result-actions">
        <button class="icon-btn" id="copyBtn" type="button" title="Копировать">📋</button>
        <button class="icon-btn" id="openBtn" type="button" title="Открыть">↗</button>
      </div>
    </div>
  </section>

  <section class="history">
    <div class="history-head">
      <div class="history-title">
        Мои ссылки
        <span class="badge" id="countBadge" style="display:none;">0</span>
      </div>
      <div class="history-controls">
        <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off">
        <button class="btn-ghost danger" id="clearBtn" type="button" style="display:none;">Очистить</button>
      </div>
    </div>
    <div class="links" id="linksList"></div>
    <div class="empty" id="emptyState">
      <div class="empty-icon">📭</div>
      <h3>Пока пусто</h3>
      <p>Сократите первую ссылку — она появится здесь</p>
    </div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'link_shortener_v11';
  var THEME_KEY = 'link_shortener_theme';

  function $(id) { return document.getElementById(id); }

  var urlInput    = $('urlInput');
  var shortenBtn  = $('shortenBtn');
  var hint        = $('hint');
  var result      = $('result');
  var resultLink  = $('resultLink');
  var copyBtn     = $('copyBtn');
  var openBtn     = $('openBtn');
  var searchInput = $('searchInput');
  var linksList   = $('linksList');
  var emptyState  = $('emptyState');
  var countBadge  = $('countBadge');
  var clearBtn    = $('clearBtn');
  var toast       = $('toast');
  var themeBtn    = $('themeBtn');

  var searchQuery = '';

  /* ---------- Storage ---------- */
  function load() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function save(links) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(links)); }
    catch (e) { showToast('Ошибка сохранения', 'error'); }
  }

  /* ---------- Helpers ---------- */
  function normalizeUrl(raw) {
    var v = String(raw || '').trim();
    if (!v) return null;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try {
      var u = new URL(v);
      if (!u.hostname || u.hostname.indexOf('.') === -1 && u.hostname !== 'localhost') return null;
      return u.href;
    } catch (e) { return null; }
  }

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); }
    catch (e) { return ''; }
  }

  function timeAgo(ts) {
    var d = Date.now() - ts;
    var m = Math.floor(d / 60000);
    if (m < 1) return 'только что';
    if (m < 60) return m + ' мин назад';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' ч назад';
    var days = Math.floor(h / 24);
    if (days < 30) return days + ' дн назад';
    try { return new Date(ts).toLocaleDateString('ru-RU'); }
    catch (e) { return ''; }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* ---------- Toast ---------- */
  var toastTimer;
  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = 'toast'; }, 2500);
  }

  /* ---------- Copy ---------- */
  function copy(text, btn) {
    function done() {
      if (btn) {
        var orig = btn.textContent;
        btn.textContent = '✓';
        btn.className = 'icon-btn ok';
        setTimeout(function () {
          btn.textContent = orig;
          btn.className = 'icon-btn';
        }, 1200);
      }
      showToast('Скопировано', 'success');
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;left:-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      } catch (e) {
        showToast('Не удалось скопировать', 'error');
      }
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  /* ---------- Render ---------- */
  function render() {
    var all = load();
    var q = searchQuery.trim().toLowerCase();
    var filtered = q
      ? all.filter(function (l) {
          return l.long.toLowerCase().indexOf(q) !== -1 ||
                 l.short.toLowerCase().indexOf(q) !== -1;
        })
      : all;

    if (all.length) {
      countBadge.style.display = 'inline-block';
      countBadge.textContent = all.length;
      clearBtn.style.display = 'inline-block';
    } else {
      countBadge.style.display = 'none';
      clearBtn.style.display = 'none';
    }

    linksList.innerHTML = '';

    if (!filtered.length) {
      emptyState.style.display = 'block';
      emptyState.innerHTML = (q && all.length)
        ? '<div class="empty-icon">🔍</div><h3>Ничего не найдено</h3><p>Попробуйте другой запрос</p>'
        : '<div class="empty-icon">📭</div><h3>Пока пусто</h3><p>Сократите первую ссылку — она появится здесь</p>';
      return;
    }
    emptyState.style.display = 'none';

    filtered.sort(function (a, b) { return b.created - a.created; });

    filtered.forEach(function (item) {
      var host = hostOf(item.long);
      var el = document.createElement('div');
      el.className = 'link-item';

      var faviconHtml = host
        ? '<img src="https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64" alt="" onerror="this.style.display=\'none\';this.parentNode.textContent=\'🔗\'">'
        : '🔗';

      el.innerHTML =
        '<div class="link-favicon">' + faviconHtml + '</div>' +
        '<div class="link-body">' +
          '<a class="link-short" href="' + escapeHtml(item.short) + '" target="_blank" rel="noopener">' +
            escapeHtml(item.short) +
          '</a>' +
          '<div class="link-meta">' +
            '<span class="link-long" title="' + escapeHtml(item.long) + '">' + escapeHtml(item.long) + '</span>' +
            '<span>·</span>' +
            '<span>' + timeAgo(item.created) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="link-actions">' +
          '<button class="icon-btn" data-act="copy" type="button" title="Копировать">📋</button>' +
          '<button class="icon-btn del" data-act="del" type="button" title="Удалить">✕</button>' +
        '</div>';

      el.querySelector('[data-act="copy"]').addEventListener('click', function (e) {
        copy(item.short, e.currentTarget);
      });

      el.querySelector('[data-act="del"]').addEventListener('click', function () {
        var links = load().filter(function (l) { return l.short !== item.short; });
        save(links);
        render();
        showToast('Удалено');
      });

      linksList.appendChild(el);
    });
  }

  /* ---------- Shorten Logic (Clck.ru) ---------- */
  function shorten() {
    hint.textContent = '';
    hint.className = 'hint';
    urlInput.className = '';
    result.className = 'result';

    var norm = normalizeUrl(urlInput.value);
    if (!norm) {
      hint.textContent = 'Введите корректный URL — например, example.com/page';
      hint.className = 'hint error';
      urlInput.className = 'invalid';
      urlInput.focus();
      return;
    }

    var links = load();
    var existing = links.find(function(l) { return l.long === norm; });
    
    if (existing) {
      showResult(existing.short);
      urlInput.value = '';
      showToast('Эта ссылка уже сокращена');
      return;
    }

    var origText = shortenBtn.textContent;
    shortenBtn.textContent = 'Ждите...';
    shortenBtn.disabled = true;
    hint.textContent = 'Отправляем запрос на clck.ru...';

    var apiUrl = 'https://clck.ru/--?url=' + encodeURIComponent(norm);

    var timeout = setTimeout(function() {
      shortenBtn.textContent = origText;
      shortenBtn.disabled = false;
      hint.textContent = 'Ошибка: сервер не отвечает. Проверьте интернет.';
      hint.className = 'hint error';
      showToast('Таймаут', 'error');
    }, 5000);

    fetch(apiUrl)
      .then(function(res) {
        clearTimeout(timeout);
        if (!res.ok) throw new Error('Ошибка');
        return res.text();
      })
      .then(function(shortUrl) {
        if (!shortUrl || !shortUrl.startsWith('http')) {
          throw new Error('Неверный ответ API');
        }
        
        var item = {
          long: norm,
          short: shortUrl.trim(),
          created: Date.now()
        };
        
        links.push(item);
        save(links);
        showResult(item.short);
        render();
        urlInput.value = '';
        urlInput.focus();
        showToast('Ссылка сокращена', 'success');
      })
      .catch(function(err) {
        clearTimeout(timeout);
        hint.textContent = 'Ошибка: не удалось получить ответ от clck.ru.';
        hint.className = 'hint error';
        showToast('Не удалось сократить', 'error');
      })
      .finally(function() {
        shortenBtn.textContent = origText;
        shortenBtn.disabled = false;
      });
  }

  function showResult(short) {
    resultLink.textContent = short;
    resultLink.href = short;
    result.className = 'result show';
  }

  /* ---------- Theme ---------- */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  /* ---------- Events ---------- */
  shortenBtn.addEventListener('click', shorten);

  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); shorten(); }
  });

  urlInput.addEventListener('input', function () {
    urlInput.className = '';
    hint.className = 'hint';
    hint.textContent = 'Ссылки создаются через сервис clck.ru';
  });

  copyBtn.addEventListener('click', function () {
    copy(resultLink.textContent, copyBtn);
  });

  openBtn.addEventListener('click', function () {
    window.open(resultLink.textContent, '_blank');
  });

  searchInput.addEventListener('input', function (e) {
    searchQuery = e.target.value;
    render();
  });

  clearBtn.addEventListener('click', function () {
    if (!confirm('Удалить все ссылки?')) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    searchQuery = '';
    searchInput.value = '';
    result.className = 'result';
    render();
    showToast('Все ссылки удалены');
  });

  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  /* ---------- Init ---------- */
  (function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved) applyTheme(saved);
    else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
      applyTheme('dark');
    else applyTheme('light');
  })();

  render();
  urlInput.focus();
})();
</script>
</body>
  </html>
